name: Apply single England Works Watch entry

on:
  push:
    branches: [add-england-works-watch]
    paths: ['.github/workflows/apply-eww-entry.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-england-works-watch
      - name: Add England Works Watch entry and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          entry='''- [England Works Watch](https://england-works-watch-production.up.railway.app/openapi.json) `https://england-works-watch-production.up.railway.app/mcp`\n  [![England Works Watch MCP connector](https://glama.ai/mcp/connectors/io.github.ChanghuLiu/england-works-watch/badges/score.svg)](https://glama.ai/mcp/connectors/io.github.ChanghuLiu/england-works-watch)\n  🔓 - Evidence-backed Skilled Worker sponsor change-impact decisions for England.\n'''
          if 'England Works Watch' not in s:
              marker='### ⚖️ <a name="legal"></a>Legal\n\n'
              assert marker in s
              s=s.replace(marker, marker+entry, 1)
              p.write_text(s)
          Path('.github/workflows/apply-eww-entry.yml').unlink()
          PY
          git config user.name 'ChanghuLiu'
          git config user.email '122949289+ChanghuLiu@users.noreply.github.com'
          git add README.md .github/workflows/apply-eww-entry.yml
          git commit -m 'Add England Works Watch'
          git push origin HEAD:add-england-works-watch
