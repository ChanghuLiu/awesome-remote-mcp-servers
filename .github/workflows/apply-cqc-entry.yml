name: Apply single CQC entry

on:
  push:
    branches: [add-cqc-provider-regulatory-decision-layer]
    paths: ['.github/workflows/apply-cqc-entry.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-cqc-provider-regulatory-decision-layer
      - name: Add CQC entry and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          entry='''- [CQC Provider Regulatory Decision Layer](https://cqc-provider-mcp-production.up.railway.app/openapi.json) `https://cqc-provider-mcp-production.up.railway.app/mcp`\n  [![CQC Provider Regulatory Decision Layer MCP connector](https://glama.ai/mcp/connectors/io.github.ChanghuLiu/cqc-provider-regulatory-decision-layer/badges/score.svg)](https://glama.ai/mcp/connectors/io.github.ChanghuLiu/cqc-provider-regulatory-decision-layer)\n  🔓 - CQC registration, provider-change and notification preflight decisions for England with official evidence.\n'''
          if 'CQC Provider Regulatory Decision Layer' not in s:
              marker='### ⚖️ <a name="legal"></a>Legal\n\n'
              assert marker in s
              s=s.replace(marker, marker+entry, 1)
              p.write_text(s)
          Path('.github/workflows/apply-cqc-entry.yml').unlink()
          PY
          git config user.name 'ChanghuLiu'
          git config user.email '122949289+ChanghuLiu@users.noreply.github.com'
          git add README.md .github/workflows/apply-cqc-entry.yml
          git commit -m 'Add CQC Provider Regulatory Decision Layer'
          git push origin HEAD:add-cqc-provider-regulatory-decision-layer
