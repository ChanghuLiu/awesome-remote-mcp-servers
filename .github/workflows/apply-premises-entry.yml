name: Apply single UK Premises Licence entry

on:
  push:
    branches: [add-uk-premises-licence-preflight]
    paths: ['.github/workflows/apply-premises-entry.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-uk-premises-licence-preflight
      - name: Add UK Premises Licence entry and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          entry='''- [UK Premises Licence Preflight](https://uk-premises-licence-mcp-production.up.railway.app/openapi.json) `https://uk-premises-licence-mcp-production.up.railway.app/mcp`\n  [![UK Premises Licence Preflight MCP connector](https://glama.ai/mcp/connectors/io.github.ChanghuLiu/uk-premises-licence-mcp/badges/score.svg)](https://glama.ai/mcp/connectors/io.github.ChanghuLiu/uk-premises-licence-mcp)\n  🔓 - UK premises-licensing preflight across 10 authorities with evidence guards and x402 decisions.\n'''
          if 'UK Premises Licence Preflight' not in s:
              marker='\n### 🎯 <a name="marketing"></a>Marketing'
              assert marker in s
              s=s.replace(marker, '\n'+entry+marker, 1)
              p.write_text(s)
          Path('.github/workflows/apply-premises-entry.yml').unlink()
          PY
          git config user.name 'ChanghuLiu'
          git config user.email '122949289+ChanghuLiu@users.noreply.github.com'
          git add README.md .github/workflows/apply-premises-entry.yml
          git commit -m 'Add UK Premises Licence Preflight'
          git push origin HEAD:add-uk-premises-licence-preflight
